services:
  pacientes-service:
    build: ./pacientes-service
    ports:
      - "8091:8080"
    environment:
      DB_URL: jdbc:mysql://db1:3306/db_pacientesservice?createDatabaseIfNotExist=true
      DB_USER: app
      DB_PASSWORD: app_local_123
    depends_on:
      db1:
        condition: service_healthy
    restart: unless-stopped
  citas-service:
    build: ./citas-service
    ports:
      - "8092:8080"
    environment:
      DB_URL: jdbc:mysql://db2:3306/db_citasservice?createDatabaseIfNotExist=true
      DB_USER: app
      DB_PASSWORD: app_local_123
      REFERENCE_URL: http://pacientes-service:8080/api/pacientes
    depends_on:
      db2:
        condition: service_healthy
      pacientes-service:
        condition: service_started
    restart: unless-stopped
  db1:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local_123
      MYSQL_DATABASE: db_pacientesservice
      MYSQL_USER: app
      MYSQL_PASSWORD: app_local_123
    volumes:
      - datos1:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
  db2:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_local_123
      MYSQL_DATABASE: db_citasservice
      MYSQL_USER: app
      MYSQL_PASSWORD: app_local_123
    volumes:
      - datos2:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
volumes:
  datos1:
  datos2:
